name: Build 009 Nine Start APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and unzip V3.8.2 project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 2 -type f -iname '*V3.8.2*APK*.zip' | head -n 1)"

          if [ -z "${ZIP:-}" ]; then
            echo "找不到 V3.8.2 APK ZIP"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted_project
          mkdir extracted_project
          unzip -q "$ZIP" -d extracted_project

          SETTINGS="$(find extracted_project -type f -name settings.gradle | head -n 1)"

          if [ -z "${SETTINGS:-}" ]; then
            echo "解壓後找不到 settings.gradle"
            find extracted_project -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Verify project before build
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "compileSdk 36" "$PROJECT_DIR/app/build.gradle"
          grep -q "targetSdk 36" "$PROJECT_DIR/app/build.gradle"
          grep -q "buildConfig true" "$PROJECT_DIR/app/build.gradle"

          echo "Project verification passed."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo
