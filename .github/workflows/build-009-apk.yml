name: Build 009 Nine Start APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and unzip V3.8.2 project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname '*V3.8.2*APK*.zip' | head -n 1)
          test -n "$ZIP"
          echo "Using ZIP: $ZIP"

          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "$ZIP" -d extracted_project

          SETTINGS=$(find extracted_project -type f -name settings.gradle | head -n 1)
          test -n "$SETTINGS"

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "
