name: Build 009 Nine Start APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find V3.8.2 ZIP
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 2 -type f
          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*V3.8.2*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP_FILE"

      - name: Unzip V3.8.2 project
        run: |
          rm -rf apk-project
          mkdir -p apk-project
          unzip -q "$ZIP_FILE" -d apk-project
          echo "=== Extracted files ==="
          find apk-project -maxdepth 3 -type f | head -n 100

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find apk-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$SETTINGS_FILE"
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify Android project
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle" || test -f "$PROJECT_DIR/settings.gradle.kts"
          test -d "$PROJECT_DIR/app"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)
          test -n "$APK_FILE"
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
          echo "APK created:"
          ls -lh "$APK_FILE"

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$APK_FILE" output/009-nine-start-V3.8.2.apk
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 009-nine-start-V3.8.2-APK
          path: output/009-nine-start-V3.8.2.apk
          if-no-files-found: error
          retention-days: 30
